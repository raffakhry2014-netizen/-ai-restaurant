<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173f32" />
  <title>Gastlyo Menu</title>

  
<style>
@import url('https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&family=Playfair+Display+SC:wght@700&display=swap');

:root{
  --primary:#DC2626; --primary-dark:#991B1B; --accent:#A16207;
  --bg:#FEF2F2; --surface:#FFFFFF; --ink:#450A0A; --text:#0F172A;
  --muted:#64748B; --line:#FECACA; --success:#15803D;
  --shadow:0 16px 42px rgba(69,10,10,.10); --shadow-sm:0 8px 22px rgba(69,10,10,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Karla",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
img{display:block;max-width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid rgba(161,98,7,.42); outline-offset:3px;
}

.site-header{
  color:#fff; position:relative; overflow:hidden;
  background:
    radial-gradient(circle at 84% 14%,rgba(248,113,113,.24),transparent 27rem),
    linear-gradient(135deg,#450A0A,#7F1D1D 58%,#991B1B);
  padding:18px 16px 34px;
}
.site-header:before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),
             linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:36px 36px;
}
.topbar{
  width:min(1100px,100%); margin:auto; position:relative; z-index:2;
  display:flex; justify-content:space-between; align-items:center; gap:14px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:56px;height:56px;object-fit:cover;border-radius:17px;background:#fff;
  box-shadow:0 10px 26px rgba(0,0,0,.2);flex:0 0 auto;
}
.brand-text h1{
  margin:0;font-family:"Playfair Display SC",serif;font-size:clamp(19px,2.5vw,27px);
  line-height:1.06;
}
.brand-text p{margin:5px 0 0;color:rgba(255,255,255,.72);font-size:12px}
.language-select{
  min-height:44px;min-width:140px;padding:9px 11px;border-radius:14px;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.10);
  color:#fff;backdrop-filter:blur(10px);
}
.language-select option{background:#fff;color:#111827}

/* KIWA is the product hero */
.kiwa-hero{
  width:min(900px,100%);margin:36px auto 0;position:relative;z-index:2;text-align:center;
}
.eyebrow{
  display:inline-flex;align-items:center;min-height:32px;padding:6px 10px;
  border:1px solid rgba(255,255,255,.17);border-radius:999px;
  background:rgba(255,255,255,.09);color:#FDE68A;font-size:12px;font-weight:800;
}
.kiwa-hero h2{
  margin:14px auto 10px;max-width:760px;font-family:"Playfair Display SC",serif;
  font-size:clamp(36px,5.5vw,64px);line-height:.98;letter-spacing:-.02em;text-wrap:balance;
}
.kiwa-hero>p{
  max-width:690px;margin:0 auto 20px;color:rgba(255,255,255,.80);
  font-size:15px;line-height:1.65;
}
.ai-box{
  text-align:start;background:#fff;color:var(--text);border-radius:25px;
  border:1px solid rgba(255,255,255,.24);box-shadow:0 24px 60px rgba(0,0,0,.25);
  overflow:hidden;
}
.ai-titlebar{
  padding:16px 18px 0;display:flex;align-items:center;gap:11px;
}
.ai-icon{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:var(--primary);color:#fff;box-shadow:0 7px 18px rgba(220,38,38,.22);
}
.ai-icon svg{width:21px;height:21px}
.ai-title-text strong{display:block;color:var(--ink);font-size:16px}
.ai-title-text span{display:block;margin-top:2px;color:var(--muted);font-size:12px}
.ai-content{display:block;padding:14px 18px 18px}
.ai-content p{margin:0 0 11px;color:var(--muted);font-size:13px;line-height:1.55}
.ai-row{display:flex;gap:9px}
.ai-row input{
  width:100%;min-width:0;min-height:56px;padding:13px 15px;border-radius:16px;
  border:1px solid #E7E5E4;background:#fff;color:var(--text);font-size:16px;
}
.ai-row button{
  min-width:118px;min-height:56px;border:0;border-radius:16px;padding:12px 17px;
  background:var(--primary);color:#fff;font-weight:900;font-size:15px;
}
.ai-row button:hover{background:#B91C1C}
.ai-row button:disabled{opacity:.56;cursor:not-allowed}
#answer{
  margin-top:12px;padding:0 2px;white-space:pre-wrap;color:#475569;
  font-size:14px;line-height:1.65;
}
.quick-prompts{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px;
}
.quick-prompt{
  min-height:40px;padding:8px 13px;border-radius:999px;
  border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.10);
  color:#fff;font-size:12px;font-weight:800;backdrop-filter:blur(8px);
}
.quick-prompt:hover{background:rgba(255,255,255,.18)}

.container{width:min(1100px,100%);margin:auto;padding:27px 16px 62px}
.menu-intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:8px 0 14px}
.menu-intro h3{
  margin:0;color:var(--ink);font-family:"Playfair Display SC",serif;
  font-size:clamp(25px,3vw,34px);
}
.menu-intro p{margin:5px 0 0;color:var(--muted);font-size:13px}
.live-badge{
  display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;
  background:#ECFDF5;border:1px solid #BBF7D0;color:var(--success);font-size:11px;font-weight:800;
}
.live-badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}

.tools{
  position:sticky;top:0;z-index:20;padding:11px 0 10px;
  background:rgba(254,242,242,.94);backdrop-filter:blur(12px);
}
.search-shell{position:relative}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;color:#94A3B8;pointer-events:none;
}
.search{
  width:100%;min-height:48px;padding:12px 14px 12px 43px;border-radius:16px;
  border:1px solid var(--line);background:#fff;color:var(--text);box-shadow:var(--shadow-sm);
}
.category-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px}
.category-scroll::-webkit-scrollbar{display:none}
.chip{
  min-height:40px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;
  background:#fff;color:#7F1D1D;font-size:12px;font-weight:800;white-space:nowrap;
}
.chip:hover{background:#FFF1F2}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

.status{display:none;margin:10px 0 16px;border-radius:14px;padding:12px 14px;font-size:13px}
.status.show{display:block}
.status.info{background:#FFF1F2;color:#7F1D1D;border:1px solid #FECDD3}
.status.error{background:#FEF2F2;color:#991B1B;border:1px solid #FCA5A5}

.category-title{
  margin:28px 0 12px;color:var(--ink);font-family:"Playfair Display SC",serif;
  font-size:21px;
}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.item{
  overflow:hidden;border:1px solid rgba(254,202,202,.92);border-radius:22px;
  background:#fff;box-shadow:var(--shadow-sm);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
@media(hover:hover){
  .item:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#FCA5A5}
}
.item.sold-out{opacity:.62;filter:saturate(.58)}
.item-image-wrap{position:relative;overflow:hidden;aspect-ratio:4/3;background:#FEE2E2}
.item-image{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
@media(hover:hover){.item:hover .item-image{transform:scale(1.04)}}
.sold-badge{
  position:absolute;top:10px;right:10px;padding:7px 10px;border-radius:999px;
  background:rgba(69,10,10,.93);color:#fff;font-size:11px;font-weight:900;
}
.item-body{padding:15px}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.item-top>span:first-child{color:var(--ink);font-size:17px;font-weight:900;line-height:1.25}
.price{color:var(--primary);font-size:17px;font-weight:900;white-space:nowrap}
.description{min-height:39px;margin-top:8px;color:var(--muted);font-size:13px;line-height:1.5}
.nutrition{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;color:#7F1D1D;font-size:10px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{padding:5px 8px;border-radius:999px;background:#FEF3C7;color:#92400E;font-size:10px;font-weight:800}
.details{margin-top:8px;color:#7C8798;font-size:11px;line-height:1.55}
.details strong{color:#475569}
.empty{padding:30px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--muted);text-align:center}

html[dir="rtl"] body{text-align:right}
html[dir="rtl"] .search{padding:12px 43px 12px 14px}
html[dir="rtl"] .search-icon{left:auto;right:14px}
html[dir="rtl"] .sold-badge{right:auto;left:10px}
html[dir="rtl"] .item-top{flex-direction:row-reverse}

@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
  .site-header{padding:14px 12px 27px}
  .topbar{align-items:flex-start}
  .logo{width:48px;height:48px;border-radius:14px}
  .brand-text h1{font-size:17px}
  .brand-text p{font-size:10px}
  .language-select{min-width:116px;padding:8px}
  .kiwa-hero{margin-top:27px}
  .kiwa-hero h2{font-size:34px}
  .kiwa-hero>p{font-size:14px;margin-bottom:15px}
  .ai-titlebar{padding:14px 14px 0}
  .ai-content{padding:12px 14px 14px}
  .ai-row{flex-direction:column}
  .ai-row input,.ai-row button{min-height:51px}
  .ai-row button{width:100%}
  .quick-prompts{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .quick-prompts::-webkit-scrollbar{display:none}
  .quick-prompt{white-space:nowrap}
  .container{padding:22px 12px 45px}
  .menu-intro{display:block}
  .live-badge{margin-top:9px}
  .grid{grid-template-columns:1fr}
  .description{min-height:0}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>

<body>


<header class="site-header">
  <div class="topbar">
    <div class="brand">
      <img src="logo.png" alt="Kiwan Fakhri Restaurant" class="logo" />
      <div class="brand-text">
        <h1>Kiwan Fakhri Restaurant</h1>
        <p id="tagline"></p>
      </div>
    </div>

    <select id="languageSelect" class="language-select" aria-label="Language">
      <option value="de">🇩🇪 Deutsch</option>
      <option value="en">🇬🇧 English</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
      <option value="it">🇮🇹 Italiano</option>
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="fa">🇮🇷 فارسی</option>
    </select>
  </div>

  <section class="kiwa-hero">
    <span class="eyebrow">Gastlyo · AI Waiter</span>
    <h2 id="heroTitle">What would you like to eat?</h2>
    <p id="heroText">Tell KIWA what you feel like eating, your budget or dietary preferences. KIWA knows the live menu and helps you choose.</p>

    <div class="ai-box" id="aiBox">
      <div class="ai-titlebar">
        <span class="ai-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3v2M7 7h10a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M8 12h.01M16 12h.01M9 15h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="ai-title-text">
          <strong id="aiToggleText"></strong>
          <span>KIWA</span>
        </div>
      </div>

      <div class="ai-content" id="aiContent">
        <p id="aiIntro"></p>
        <div class="ai-row">
          <input id="question" type="text" autocomplete="off" />
          <button id="askButton" type="button">Ask KIWA</button>
        </div>
        <div id="answer"></div>
      </div>
    </div>

    <div class="quick-prompts">
      <button type="button" class="quick-prompt" data-key="lowcal" id="quickLowCal">Low calorie</button>
      <button type="button" class="quick-prompt" data-key="veggie" id="quickVeggie">Vegetarian</button>
      <button type="button" class="quick-prompt" data-key="budget" id="quickBudget">Under €15</button>
      <button type="button" class="quick-prompt" data-key="best" id="quickBest">Bestsellers</button>
    </div>
  </section>
</header>

<main class="container">
  <div class="menu-intro">
    <div>
      <h3 id="menuTitle">Our Menu</h3>
      <p id="menuSubtitle">Or explore the menu yourself.</p>
    </div>
    <span class="live-badge" id="menuLive">Live menu</span>
  </div>


  <section class="tools">
    <div class="search-shell">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input id="searchInput" class="search" type="search" placeholder="Menü durchsuchen..." />
    </div>
    <div id="categoryBar" class="category-scroll"></div>
  </section>

  <div id="status" class="status"></div>
  <div id="menu"></div>

</main>

<script src="i18n.js"></script>

<script>
const RESTAURANT_SLUG = "kiwan-fakhri";
const supportedLanguages = ["de","en","fr","es","it","tr","ar","fa"];
const categoryOrder = ["Starter","Salad","Burger","Main","Pasta","Vegan","Dessert","Cold Drink","Hot Drink"];

let currentLanguage = "en";
let allItems = [];
let currentCategory = "all";
let supabaseConfig = null;
let restaurantId = null;

function getAnalyticsSessionId(){
  let id=sessionStorage.getItem("gastlyo_analytics_session");
  if(!id){
    id=crypto.randomUUID();
    sessionStorage.setItem("gastlyo_analytics_session",id);
  }
  return id;
}

const $ = id => document.getElementById(id);

function detectLanguage(){
  const saved = localStorage.getItem("restaurant-language");
  if(saved && supportedLanguages.includes(saved)) return saved;

  const browser = (navigator.languages?.[0] || navigator.language || "en").toLowerCase();
  const base = browser.split("-")[0];

  return supportedLanguages.includes(base) ? base : "en";
}

function t(){
  return I18N.ui[currentLanguage] || I18N.ui.en;
}

function setDirection(lang){
  const rtl = ["fa","ar"].includes(lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = rtl ? "rtl" : "ltr";
}

function translatedName(item){
  return I18N.itemNames?.[String(item.external_id)]?.[currentLanguage] || item.name;
}

function showStatus(text,type="info"){
  const el = $("status");
  el.textContent = text;
  el.className = `status show ${type}`;
}

function hideStatus(){
  $("status").className = "status";
  $("status").textContent = "";
}

async function jsonFetch(url, options={}){
  const response = await fetch(url, options);
  let data = null;

  try{ data = await response.json(); }catch{}

  if(!response.ok){
    throw new Error(data?.message || data?.error || `HTTP ${response.status}`);
  }

  return data;
}

async function trackEvent(eventType, extra={}){
  try{
    if(!supabaseConfig?.supabaseUrl || !supabaseConfig?.supabaseAnonKey || !restaurantId) return;

    await fetch(`${supabaseConfig.supabaseUrl}/rest/v1/analytics_events`,{
      method:"POST",
      headers:{
        apikey:supabaseConfig.supabaseAnonKey,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        restaurant_id:restaurantId,
        event_type:eventType,
        menu_item_id:extra.menu_item_id || null,
        menu_item_name:extra.menu_item_name || null,
        language:extra.language || currentLanguage,
        session_id:getAnalyticsSessionId()
      })
    });
  }catch(error){
    console.debug("Analytics skipped:",error);
  }
}

async function loadMenuFromSupabase(){
  showStatus("Menü wird geladen...","info");

  supabaseConfig = await jsonFetch("/api/config", { cache:"no-store" });

  if(!supabaseConfig.supabaseUrl || !supabaseConfig.supabaseAnonKey){
    throw new Error("Supabase configuration missing.");
  }

  const headers = {
    apikey: supabaseConfig.supabaseAnonKey
  };

  const restaurants = await jsonFetch(
    `${supabaseConfig.supabaseUrl}/rest/v1/restaurants?slug=eq.${encodeURIComponent(RESTAURANT_SLUG)}&select=id,name`,
    { headers }
  );

  const restaurant = restaurants?.[0];

  if(!restaurant){
    throw new Error("Restaurant not found.");
  }

  restaurantId = restaurant.id;

  const items = await jsonFetch(
    `${supabaseConfig.supabaseUrl}/rest/v1/menu_items?restaurant_id=eq.${restaurant.id}&select=*&order=sort_order.asc,external_id.asc`,
    { headers }
  );

  allItems = items || [];
  hideStatus();
  renderCategoryBar();
  renderMenu();

  if(!sessionStorage.getItem("gastlyo_menu_view_tracked")){
    sessionStorage.setItem("gastlyo_menu_view_tracked","1");
    trackEvent("menu_view");
  }
}

function renderCategoryBar(){
  const info = t();
  const availableCategories = categoryOrder.filter(cat =>
    allItems.some(item => item.category === cat)
  );

  const allLabel =
    currentLanguage === "de" ? "Alle" :
    currentLanguage === "fa" ? "همه" :
    currentLanguage === "ar" ? "الكل" :
    currentLanguage === "tr" ? "Tümü" :
    currentLanguage === "fr" ? "Tous" :
    currentLanguage === "es" ? "Todo" :
    currentLanguage === "it" ? "Tutti" : "All";

  $("categoryBar").innerHTML = [
    `<button class="chip ${currentCategory==="all"?"active":""}" data-category="all">${allLabel}</button>`,
    ...availableCategories.map(cat => `
      <button class="chip ${currentCategory===cat?"active":""}" data-category="${cat}">
        ${info.categories?.[cat] || cat}
      </button>
    `)
  ].join("");

  document.querySelectorAll("[data-category]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      currentCategory = btn.dataset.category;
      renderCategoryBar();
      renderMenu();
    });
  });
}

function renderMenu(){
  const container = $("menu");
  const info = t();
  const q = $("searchInput").value.trim().toLowerCase();

  let filtered = allItems.filter(item => {
    if(currentCategory !== "all" && item.category !== currentCategory) return false;

    if(!q) return true;

    const haystack = [
      translatedName(item),
      item.name,
      item.description,
      item.category,
      ...(Array.isArray(item.ingredients) ? item.ingredients : []),
      ...(Array.isArray(item.tags) ? item.tags : [])
    ].join(" ").toLowerCase();

    return haystack.includes(q);
  });

  if(!filtered.length){
    const emptyText =
      currentLanguage==="de" ? "Keine passenden Menüeinträge gefunden." :
      currentLanguage==="fa" ? "موردی مطابق جستجو پیدا نشد." :
      currentLanguage==="ar" ? "لم يتم العثور على عناصر مطابقة." :
      "No matching menu items found.";

    container.innerHTML = `<div class="empty">${emptyText}</div>`;
    return;
  }

  container.innerHTML = "";

  categoryOrder.forEach(category=>{
    const items = filtered.filter(item => item.category === category);
    if(!items.length) return;

    const title = document.createElement("h2");
    title.className = "category-title";
    title.textContent = info.categories?.[category] || category;
    container.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "grid";

    items.forEach(item=>{
      const tags = [];

      if(item.vegan) tags.push(info.tags.vegan);
      else if(item.vegetarian) tags.push(info.tags.vegetarian);

      if(item.gluten_free) tags.push(info.tags.gluten_free);

      if(item.spicy_level > 0){
        tags.push(
          item.spicy_level === 1 ? info.tags.mild :
          item.spicy_level === 2 ? info.tags.medium :
          info.tags.hot
        );
      }

      if(item.bestseller) tags.push(info.tags.bestseller);

      const allergens = Array.isArray(item.allergens) && item.allergens.length
        ? item.allergens.join(", ")
        : info.no_allergens;

      const ingredients = Array.isArray(item.ingredients)
        ? item.ingredients.join(", ")
        : "";

      const img = item.image_url || `images/menu-${String(item.external_id).padStart(2,"0")}.webp`;

      const soldText =
        currentLanguage==="de" ? "Ausverkauft" :
        currentLanguage==="fa" ? "ناموجود" :
        currentLanguage==="ar" ? "غير متوفر" :
        currentLanguage==="tr" ? "Tükendi" :
        currentLanguage==="fr" ? "Épuisé" :
        currentLanguage==="es" ? "Agotado" :
        currentLanguage==="it" ? "Esaurito" : "Sold out";

      const card = document.createElement("article");
      card.className = `item ${item.available ? "" : "sold-out"}`;
      card.dataset.analyticsItemId = item.id;
      card.dataset.analyticsItemName = item.name;

      card.innerHTML = `
        <div class="item-image-wrap">
          <img class="item-image" src="${img}" alt="${translatedName(item)}" loading="lazy"
               onerror="this.parentElement.style.display='none'">
          ${item.available ? "" : `<span class="sold-badge">${soldText}</span>`}
        </div>

        <div class="item-body">
          <div class="item-top">
            <span>${translatedName(item)}</span>
            <span class="price">€${Number(item.price).toFixed(2)}</span>
          </div>

          <div class="description">${item.description || ""}</div>

          <div class="nutrition">
            🔥 ${item.calories ?? 0} kcal
            &nbsp;•&nbsp; 💪 ${item.protein ?? 0}g
            &nbsp;•&nbsp; ${item.fat ?? 0}g Fett
            &nbsp;•&nbsp; ${item.carbs ?? 0}g KH
          </div>

          ${tags.length ? `
            <div class="tags">
              ${tags.map(tag=>`<span class="tag">${tag}</span>`).join("")}
            </div>
          ` : ""}

          <div class="details">
            <strong>${info.ingredients}:</strong> ${ingredients}
          </div>

          <div class="details">
            <strong>${info.allergens}:</strong> ${allergens}
          </div>

          <div class="details">
            ${item.serving_size ? `${info.portion}: ${item.serving_size}` : ""}
            ${item.prep_time ? ` • ${info.prep}: ~${item.prep_time} ${info.minutes}` : ""}
          </div>
        </div>
      `;

      card.addEventListener("click",()=>{
        trackEvent("item_click",{
          menu_item_id:item.id,
          menu_item_name:item.name
        });
      });

      grid.appendChild(card);
    });

    container.appendChild(grid);
  });
}

async function askWaiter(){
  const message = $("question").value.trim();
  const info = t();

  if(!message){
    $("answer").innerText = info.empty;
    return;
  }

  $("answer").innerText = info.thinking;
  $("askButton").disabled = true;

  try{
    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message,
        language:currentLanguage,
        sessionId:getAnalyticsSessionId()
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Server error");
    }

    $("answer").innerText = data.answer;

  }catch(error){
    console.error(error);
    $("answer").innerText = info.error;
  }finally{
    $("askButton").disabled = false;
  }
}
