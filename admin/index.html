<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gastlyo Admin</title>
<style>
    :root{
      --green:#1f4d3b;
      --cream:#f7f4ee;
      --card:#ffffff;
      --text:#1d2a24;
      --muted:#6f7b75;
      --line:#e4e8e5;
      --danger:#b13a3a;
      --ok:#18864b;
      --yellow:#e9b949;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--cream);
      color:var(--text);
    }

    header{
      background:var(--green);
      color:white;
      padding:18px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }

    header h1{margin:0;font-size:22px}
    header .small{opacity:.8;font-size:13px}

    .wrap{
      max-width:1180px;
      margin:28px auto;
      padding:0 16px;
    }

    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:22px;
      box-shadow:0 8px 28px rgba(0,0,0,.05);
    }

    .login{
      max-width:430px;
      margin:60px auto;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:14px 0 6px;
    }

    input,textarea,select{
      width:100%;
      padding:11px 12px;
      border:1px solid #ccd5d0;
      border-radius:10px;
      background:white;
      font-size:14px;
    }

    textarea{min-height:82px;resize:vertical}

    button{
      border:none;
      border-radius:10px;
      padding:11px 14px;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .primary{background:var(--green);color:white}
    .secondary{background:#edf2ef;color:var(--green)}
    .danger{background:#f9e9e9;color:var(--danger)}
    .yellow{background:var(--yellow);color:#2e2a1d}
    .full{width:100%;margin-top:16px}

    .hidden{display:none!important}

    .message{
      margin-top:12px;
      padding:10px 12px;
      border-radius:10px;
      font-size:13px;
      line-height:1.45;
      display:none;
    }

    .message.error{
      display:block;
      color:var(--danger);
      background:#fbecec;
      border:1px solid #f2caca;
    }

    .message.success{
      display:block;
      color:var(--ok);
      background:#eaf7ef;
      border:1px solid #c7ead4;
    }

    .message.info{
      display:block;
      color:#35534a;
      background:#eef5f2;
      border:1px solid #d7e6df;
    }

    .toolbar{
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .toolbar .left{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .count{
      font-size:13px;
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
      gap:14px;
    }

    .item{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:15px;
    }

    .item-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:10px;
    }

    .item-name{font-weight:800}
    .price{font-weight:800;color:var(--green)}

    .badge{
      display:inline-block;
      font-size:11px;
      padding:5px 8px;
      border-radius:999px;
      margin-top:6px;
      background:#eef3f0;
      color:#4e5d55;
    }

    .available{background:#e5f5eb;color:#14743f}
    .soldout{background:#f7e7e7;color:#9f2f2f}

    .actions{
      display:flex;
      gap:8px;
      margin-top:12px;
    }

    .actions button{flex:1}

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.42);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:50;
    }

    .modal-card{
      width:min(760px,100%);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border-radius:18px;
      padding:20px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .checks{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:12px;
    }

    .check{
      display:flex;
      gap:7px;
      align-items:center;
      border:1px solid var(--line);
      padding:9px;
      border-radius:10px;
      font-size:13px;
    }

    .check input{width:auto}

    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:18px;
    }

    @media(max-width:650px){
      .row{grid-template-columns:1fr}
      .checks{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Gastlyo Admin</h1>
    <div class="small">Kiwan Fakhri Restaurant</div>
  </div>

  <button id="logoutBtn" class="secondary hidden">
    Abmelden
  </button>
</header>


<div class="wrap">

  <section id="loginView" class="panel login">

    <h2>Admin Login</h2>

    <p style="color:#6f7b75">
      Melde dich mit deinem Restaurant-Admin-Konto an.
    </p>

    <label>E-Mail</label>
    <input
      id="email"
      type="email"
      autocomplete="email"
    />

    <label>Passwort</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
    />

    <button
      id="loginBtn"
      class="primary full"
    >
      Anmelden
    </button>

    <div
      id="loginMsg"
      class="message"
    ></div>

  </section>


  <section
    id="adminView"
    class="hidden"
  >

    <div class="panel">

      <div class="toolbar">

        <div class="left">

          <button
            id="refreshBtn"
            class="secondary"
          >
            Aktualisieren
          </button>

          <span
            id="itemCount"
            class="count"
          ></span>

        </div>

        <div class="count">
          Preis ändern • Verfügbarkeit • Menüdetails
        </div>

      </div>

      <div
        id="items"
        class="grid"
      ></div>

      <div
        id="adminMsg"
        class="message"
      ></div>

    </div>

  </section>

</div>


<div
  id="editModal"
  class="modal hidden"
>

  <div class="modal-card">

    <h2>Menüeintrag bearbeiten</h2>

    <input
      id="editId"
      type="hidden"
    />

    <div class="row">

      <div>
        <label>Name</label>
        <input id="editName" />
      </div>

      <div>
        <label>Preis (€)</label>
        <input
          id="editPrice"
          type="number"
          min="0"
          step="0.01"
        />
      </div>

    </div>

    <label>Beschreibung</label>
    <textarea id="editDescription"></textarea>

    <div class="row">

      <div>
        <label>Kategorie</label>
        <input id="editCategory" />
      </div>

      <div>
        <label>Portion</label>
        <input id="editServing" />
      </div>

    </div>

    <div class="row">

      <div>
        <label>Kalorien</label>
        <input
          id="editCalories"
          type="number"
          min="0"
        />
      </div>

      <div>
        <label>Protein (g)</label>
        <input
          id="editProtein"
          type="number"
          min="0"
        />
      </div>

    </div>

    <div class="row">

      <div>
        <label>Fett (g)</label>
        <input
          id="editFat"
          type="number"
          min="0"
        />
      </div>

      <div>
        <label>Kohlenhydrate (g)</label>
        <input
          id="editCarbs"
          type="number"
          min="0"
        />
      </div>

    </div>

    <label>Zutaten (durch Komma trennen)</label>
    <textarea id="editIngredients"></textarea>

    <label>Allergene (durch Komma trennen)</label>
    <textarea id="editAllergens"></textarea>

    <div class="checks">

      <label class="check">
        <input
          id="editVegetarian"
          type="checkbox"
        />
        Vegetarisch
      </label>

      <label class="check">
        <input
          id="editVegan"
          type="checkbox"
        />
        Vegan
      </label>

      <label class="check">
        <input
          id="editGlutenFree"
          type="checkbox"
        />
        Glutenfrei
      </label>

      <label class="check">
        <input
          id="editBestseller"
          type="checkbox"
        />
        Bestseller
      </label>

      <label class="check">
        <input
          id="editAvailable"
          type="checkbox"
        />
        Verfügbar
      </label>

    </div>

    <div class="modal-actions">

      <button
        id="cancelEdit"
        class="secondary"
      >
        Abbrechen
      </button>

      <button
        id="saveEdit"
        class="primary"
      >
        Speichern
      </button>

    </div>

    <div
      id="editMsg"
      class="message"
    ></div>

  </div>

</div>


<script>
const RESTAURANT_SLUG="kiwan-fakhri";
let cfg=null, accessToken=null, userId=null, restaurantId=null, currentItems=[];
const $=id=>document.getElementById(id);

function showMessage(el,text,type="error"){el.textContent=text||"";el.className="message "+type}
function clearMessage(el){el.textContent="";el.className="message"}
function esc(v=""){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}

async function jsonFetch(url,options={}){
  const r=await fetch(url,options);
  let d=null;
  try{d=await r.json()}catch{}
  if(!r.ok){
    throw new Error(d?.msg||d?.message||d?.error_description||d?.error||`HTTP ${r.status}`);
  }
  return d;
}

function headers(auth=true){
  const h={"apikey":cfg.supabaseAnonKey,"Content-Type":"application/json"};
  if(auth&&accessToken) h.Authorization=`Bearer ${accessToken}`;
  return h;
}

async function init(){
  try{
    showMessage($("loginMsg"),"Verbindung wird hergestellt...","info");
    cfg=await jsonFetch("/api/config",{cache:"no-store"});
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey) throw new Error("SUPABASE_URL oder SUPABASE_ANON_KEY fehlt.");

    const savedToken=sessionStorage.getItem("gastlyo_access_token");
    const savedUser=sessionStorage.getItem("gastlyo_user_id");

    if(savedToken&&savedUser){
      accessToken=savedToken;
      userId=savedUser;
      try{await enterAdmin();return}catch(e){
        sessionStorage.removeItem("gastlyo_access_token");
        sessionStorage.removeItem("gastlyo_user_id");
        accessToken=null; userId=null;
      }
    }

    $("loginBtn").disabled=false;
    showMessage($("loginMsg"),"Verbindung bereit. Bitte anmelden.","success");
  }catch(e){
    console.error(e);
    $("loginBtn").disabled=true;
    showMessage($("loginMsg"),"Verbindungsfehler: "+(e.message||"Unbekannter Fehler"),"error");
  }
}

async function login(){
  if(!cfg){showMessage($("loginMsg"),"Verbindung ist noch nicht bereit.","error");return}
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||!password){showMessage($("loginMsg"),"Bitte E-Mail und Passwort eingeben.","error");return}

  $("loginBtn").disabled=true;
  $("loginBtn").textContent="Anmeldung läuft...";
  showMessage($("loginMsg"),"Anmeldung läuft...","info");

  try{
    const auth=await jsonFetch(`${cfg.supabaseUrl}/auth/v1/token?grant_type=password`,{
      method:"POST",
      headers:{"apikey":cfg.supabaseAnonKey,"Content-Type":"application/json"},
      body:JSON.stringify({email,password})
    });

    accessToken=auth.access_token;
    userId=auth.user?.id;
    if(!accessToken||!userId) throw new Error("Login-Daten wurden nicht vollständig zurückgegeben.");

    sessionStorage.setItem("gastlyo_access_token",accessToken);
    sessionStorage.setItem("gastlyo_user_id",userId);

    showMessage($("loginMsg"),"Login erfolgreich. Admin-Zugriff wird geprüft...","success");
    await enterAdmin();
  }catch(e){
    let m=e.message||"Login fehlgeschlagen.";
    if(m.toLowerCase().includes("invalid login credentials")) m="E-Mail oder Passwort ist falsch.";
    showMessage($("loginMsg"),"Login fehlgeschlagen: "+m,"error");
  }finally{
    $("loginBtn").disabled=false;
    $("loginBtn").textContent="Anmelden";
  }
}

async function enterAdmin(){
  const restaurants=await jsonFetch(
    `${cfg.supabaseUrl}/rest/v1/restaurants?slug=eq.${encodeURIComponent(RESTAURANT_SLUG)}&select=id,name`,
    {headers:headers(true)}
  );
  const restaurant=restaurants?.[0];
  if(!restaurant) throw new Error("Restaurant wurde nicht gefunden.");

  const memberships=await jsonFetch(
    `${cfg.supabaseUrl}/rest/v1/restaurant_users?restaurant_id=eq.${restaurant.id}&user_id=eq.${encodeURIComponent(userId)}&select=role`,
    {headers:headers(true)}
  );
  if(!memberships?.length) throw new Error("Dieses Konto ist nicht als Restaurant-Admin freigeschaltet.");

  restaurantId=restaurant.id;
  $("loginView").classList.add("hidden");
  $("adminView").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  await loadItems();
}

async function loadItems(){
  try{
    clearMessage($("adminMsg"));
    currentItems=await jsonFetch(
      `${cfg.supabaseUrl}/rest/v1/menu_items?restaurant_id=eq.${restaurantId}&select=*&order=sort_order.asc,external_id.asc`,
      {headers:headers(true)}
    )||[];
    $("itemCount").textContent=`${currentItems.length} Menüeinträge`;
    renderItems();
  }catch(e){
    showMessage($("adminMsg"),"Menü konnte nicht geladen werden: "+e.message,"error");
  }
}

function renderItems(){
  $("items").innerHTML=currentItems.map(item=>`
    <article class="item">
      <div class="item-top">
        <div>
          <div class="item-name">${esc(item.name)}</div>
          <span class="badge">${esc(item.category)}</span>
          <span class="badge ${item.available?"available":"soldout"}">${item.available?"Verfügbar":"Ausverkauft"}</span>
        </div>
        <div class="price">€${Number(item.price).toFixed(2)}</div>
      </div>
      <div style="font-size:13px;color:#6f7b75;line-height:1.5">${esc(item.description||"")}</div>
      <div class="actions">
        <button class="secondary" data-edit="${item.id}">Bearbeiten</button>
        <button class="${item.available?"danger":"yellow"}" data-toggle="${item.id}">${item.available?"Ausverkauft":"Verfügbar"}</button>
      </div>
    </article>
  `).join("");

  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.edit)));
  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggleAvailability(Number(b.dataset.toggle)));
}

async function patchItem(id,payload){
  const r=await fetch(`${cfg.supabaseUrl}/rest/v1/menu_items?id=eq.${id}&restaurant_id=eq.${restaurantId}`,{
    method:"PATCH",
    headers:{...headers(true),"Prefer":"return=minimal"},
    body:JSON.stringify(payload)
  });
  if(!r.ok){
    let d=null; try{d=await r.json()}catch{}
    throw new Error(d?.message||d?.error||`HTTP ${r.status}`);
  }
}

async function toggleAvailability(id){
  const item=currentItems.find(x=>x.id===id);
  if(!item)return;
  try{await patchItem(id,{available:!item.available});await loadItems()}
  catch(e){showMessage($("adminMsg"),"Änderung fehlgeschlagen: "+e.message,"error")}
}

function openEdit(id){
  const i=currentItems.find(x=>x.id===id); if(!i)return;
  $("editId").value=i.id; $("editName").value=i.name||""; $("editPrice").value=i.price??"";
  $("editDescription").value=i.description||""; $("editCategory").value=i.category||"";
  $("editServing").value=i.serving_size||""; $("editCalories").value=i.calories??"";
  $("editProtein").value=i.protein??""; $("editFat").value=i.fat??""; $("editCarbs").value=i.carbs??"";
  $("editIngredients").value=Array.isArray(i.ingredients)?i.ingredients.join(", "):"";
  $("editAllergens").value=Array.isArray(i.allergens)?i.allergens.join(", "):"";
  $("editVegetarian").checked=!!i.vegetarian; $("editVegan").checked=!!i.vegan;
  $("editGlutenFree").checked=!!i.gluten_free; $("editBestseller").checked=!!i.bestseller;
  $("editAvailable").checked=!!i.available;
  clearMessage($("editMsg")); $("editModal").classList.remove("hidden");
}

const csv=v=>v.split(",").map(x=>x.trim()).filter(Boolean);

async function saveEdit(){
  const id=Number($("editId").value);
  const payload={
    name:$("editName").value.trim(), price:Number($("editPrice").value),
    description:$("editDescription").value.trim(), category:$("editCategory").value.trim(),
    serving_size:$("editServing").value.trim()||null,
    calories:$("editCalories").value===""?null:Number($("editCalories").value),
    protein:$("editProtein").value===""?null:Number($("editProtein").value),
    fat:$("editFat").value===""?null:Number($("editFat").value),
    carbs:$("editCarbs").value===""?null:Number($("editCarbs").value),
    ingredients:csv($("editIngredients").value), allergens:csv($("editAllergens").value),
    vegetarian:$("editVegetarian").checked, vegan:$("editVegan").checked,
    gluten_free:$("editGlutenFree").checked, bestseller:$("editBestseller").checked,
    available:$("editAvailable").checked
  };
  if(!payload.name||Number.isNaN(payload.price)){showMessage($("editMsg"),"Name und Preis sind erforderlich.","error");return}

  $("saveEdit").disabled=true;
  try{await patchItem(id,payload);$("editModal").classList.add("hidden");await loadItems()}
  catch(e){showMessage($("editMsg"),"Speichern fehlgeschlagen: "+e.message,"error")}
  finally{$("saveEdit").disabled=false}
}

function logout(){
  sessionStorage.removeItem("gastlyo_access_token");
  sessionStorage.removeItem("gastlyo_user_id");
  location.reload();
}

$("loginBtn").onclick=login;
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("logoutBtn").onclick=logout;
$("refreshBtn").onclick=loadItems;
$("cancelEdit").onclick=()=>$("editModal").classList.add("hidden");
$("saveEdit").onclick=saveEdit;

init();
</script>

</body>
</html>
