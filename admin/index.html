<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gastlyo Admin</title>
  <style>
    :root{
      --green:#1f4d3b;
      --green2:#2d6a52;
      --cream:#f7f4ee;
      --card:#ffffff;
      --text:#1d2a24;
      --muted:#6f7b75;
      --line:#e4e8e5;
      --danger:#b13a3a;
      --ok:#18864b;
      --yellow:#e9b949;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--cream);
      color:var(--text);
    }
    header{
      background:var(--green);
      color:white;
      padding:18px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }
    header h1{margin:0;font-size:22px}
    header .small{opacity:.8;font-size:13px}
    .wrap{max-width:1180px;margin:28px auto;padding:0 16px}
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:22px;
      box-shadow:0 8px 28px rgba(0,0,0,.05);
    }
    .login{
      max-width:430px;
      margin:60px auto;
    }
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
    input,textarea,select{
      width:100%;
      padding:11px 12px;
      border:1px solid #ccd5d0;
      border-radius:10px;
      background:white;
      font-size:14px;
    }
    textarea{min-height:82px;resize:vertical}
    button{
      border:none;
      border-radius:10px;
      padding:11px 14px;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }
    .primary{background:var(--green);color:white}
    .secondary{background:#edf2ef;color:var(--green)}
    .danger{background:#f9e9e9;color:var(--danger)}
    .yellow{background:var(--yellow);color:#2e2a1d}
    .full{width:100%;margin-top:16px}
    .hidden{display:none!important}
    .error{color:var(--danger);font-size:13px;margin-top:12px}
    .success{color:var(--ok);font-size:13px;margin-top:12px}
    .toolbar{
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .toolbar .left{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .count{font-size:13px;color:var(--muted)}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
      gap:14px;
    }
    .item{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:15px;
    }
    .item-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:10px;
    }
    .item-name{font-weight:800}
    .price{font-weight:800;color:var(--green)}
    .badge{
      display:inline-block;
      font-size:11px;
      padding:5px 8px;
      border-radius:999px;
      margin-top:6px;
      background:#eef3f0;
      color:#4e5d55;
    }
    .available{background:#e5f5eb;color:#14743f}
    .soldout{background:#f7e7e7;color:#9f2f2f}
    .actions{display:flex;gap:8px;margin-top:12px}
    .actions button{flex:1}
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.42);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:50;
    }
    .modal-card{
      width:min(760px,100%);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border-radius:18px;
      padding:20px;
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .check{
      display:flex;gap:7px;align-items:center;
      border:1px solid var(--line);
      padding:9px;border-radius:10px;
      font-size:13px
    }
    .check input{width:auto}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
    @media(max-width:650px){
      .row{grid-template-columns:1fr}
      .checks{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<header>
  <div>
    <h1>Gastlyo Admin</h1>
    <div class="small">Kiwan Fakhri Restaurant</div>
  </div>
  <button id="logoutBtn" class="secondary hidden">Abmelden</button>
</header>

<div class="wrap">
  <section id="loginView" class="panel login">
    <h2>Admin Login</h2>
    <p style="color:#6f7b75">Melde dich mit deinem Restaurant-Admin-Konto an.</p>
    <label>E-Mail</label>
    <input id="email" type="email" autocomplete="email" />
    <label>Passwort</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="loginBtn" class="primary full">Anmelden</button>
    <div id="loginMsg"></div>
  </section>

  <section id="adminView" class="hidden">
    <div class="panel">
      <div class="toolbar">
        <div class="left">
          <button id="refreshBtn" class="secondary">Aktualisieren</button>
          <span id="itemCount" class="count"></span>
        </div>
        <div class="count">Preis ändern • Verfügbarkeit • Menüdetails</div>
      </div>
      <div id="items" class="grid"></div>
      <div id="adminMsg"></div>
    </div>
  </section>
</div>

<div id="editModal" class="modal hidden">
  <div class="modal-card">
    <h2>Menüeintrag bearbeiten</h2>
    <input id="editId" type="hidden" />

    <div class="row">
      <div>
        <label>Name</label>
        <input id="editName" />
      </div>
      <div>
        <label>Preis (€)</label>
        <input id="editPrice" type="number" min="0" step="0.01" />
      </div>
    </div>

    <label>Beschreibung</label>
    <textarea id="editDescription"></textarea>

    <div class="row">
      <div>
        <label>Kategorie</label>
        <input id="editCategory" />
      </div>
      <div>
        <label>Portion</label>
        <input id="editServing" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Kalorien</label>
        <input id="editCalories" type="number" min="0" />
      </div>
      <div>
        <label>Protein (g)</label>
        <input id="editProtein" type="number" min="0" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Fett (g)</label>
        <input id="editFat" type="number" min="0" />
      </div>
      <div>
        <label>Kohlenhydrate (g)</label>
        <input id="editCarbs" type="number" min="0" />
      </div>
    </div>

    <label>Zutaten (durch Komma trennen)</label>
    <textarea id="editIngredients"></textarea>

    <label>Allergene (durch Komma trennen)</label>
    <textarea id="editAllergens"></textarea>

    <div class="checks">
      <label class="check"><input id="editVegetarian" type="checkbox" /> Vegetarisch</label>
      <label class="check"><input id="editVegan" type="checkbox" /> Vegan</label>
      <label class="check"><input id="editGlutenFree" type="checkbox" /> Glutenfrei</label>
      <label class="check"><input id="editBestseller" type="checkbox" /> Bestseller</label>
      <label class="check"><input id="editAvailable" type="checkbox" /> Verfügbar</label>
    </div>

    <div class="modal-actions">
      <button id="cancelEdit" class="secondary">Abbrechen</button>
      <button id="saveEdit" class="primary">Speichern</button>
    </div>
    <div id="editMsg"></div>
  </div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const RESTAURANT_SLUG = "kiwan-fakhri";
  let supabase;
  let restaurantId = null;
  let currentItems = [];

  const $ = id => document.getElementById(id);

  function showMsg(el, text, ok=false){
    el.className = ok ? "success" : "error";
    el.textContent = text || "";
  }

  function esc(s=""){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;");
  }

  async function init(){
    const cfgResp = await fetch("/api/config");
    const cfg = await cfgResp.json();

    if(!cfgResp.ok){
      showMsg($("loginMsg"), cfg.error || "Konfiguration konnte nicht geladen werden.");
      return;
    }

    supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    const { data:{ session } } = await supabase.auth.getSession();
    if(session) await enterAdmin();
  }

  async function login(){
    showMsg($("loginMsg"), "");
    $("loginBtn").disabled = true;

    const email = $("email").value.trim();
    const password = $("password").value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    $("loginBtn").disabled = false;

    if(error){
      showMsg($("loginMsg"), "Login fehlgeschlagen: " + error.message);
      return;
    }

    await enterAdmin();
  }

  async function enterAdmin(){
    const { data:{ user } } = await supabase.auth.getUser();
    if(!user) return;

    const { data: restaurant, error: rError } = await supabase
      .from("restaurants")
      .select("id,name")
      .eq("slug", RESTAURANT_SLUG)
      .single();

    if(rError || !restaurant){
      showMsg($("loginMsg"), "Restaurant konnte nicht geladen werden.");
      return;
    }

    const { data: membership, error: mError } = await supabase
      .from("restaurant_users")
      .select("role")
      .eq("restaurant_id", restaurant.id)
      .eq("user_id", user.id)
      .maybeSingle();

    if(mError || !membership){
      await supabase.auth.signOut();
      showMsg($("loginMsg"), "Dieses Konto hat keinen Admin-Zugriff.");
      return;
    }

    restaurantId = restaurant.id;
    $("loginView").classList.add("hidden");
    $("adminView").classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");
    await loadItems();
  }

  async function loadItems(){
    const { data, error } = await supabase
      .from("menu_items")
      .select("*")
      .eq("restaurant_id", restaurantId)
      .order("sort_order", { ascending:true })
      .order("external_id", { ascending:true });

    if(error){
      showMsg($("adminMsg"), "Menü konnte nicht geladen werden: " + error.message);
      return;
    }

    currentItems = data || [];
    $("itemCount").textContent = `${currentItems.length} Menüeinträge`;
    renderItems();
  }

  function renderItems(){
    $("items").innerHTML = currentItems.map(item => `
      <article class="item">
        <div class="item-top">
          <div>
            <div class="item-name">${esc(item.name)}</div>
            <span class="badge">${esc(item.category)}</span>
            <span class="badge ${item.available ? "available" : "soldout"}">
              ${item.available ? "Verfügbar" : "Ausverkauft"}
            </span>
          </div>
          <div class="price">€${Number(item.price).toFixed(2)}</div>
        </div>
        <div style="font-size:13px;color:#6f7b75;line-height:1.5">${esc(item.description || "")}</div>
        <div class="actions">
          <button class="secondary" data-edit="${item.id}">Bearbeiten</button>
          <button class="${item.available ? "danger" : "yellow"}" data-toggle="${item.id}">
            ${item.available ? "Ausverkauft" : "Verfügbar"}
          </button>
        </div>
      </article>
    `).join("");

    document.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.addEventListener("click",()=>openEdit(Number(btn.dataset.edit)));
    });

    document.querySelectorAll("[data-toggle]").forEach(btn=>{
      btn.addEventListener("click",()=>toggleAvailability(Number(btn.dataset.toggle)));
    });
  }

  async function toggleAvailability(id){
    const item = currentItems.find(x=>x.id===id);
    if(!item) return;

    const { error } = await supabase
      .from("menu_items")
      .update({ available: !item.available })
      .eq("id", id)
      .eq("restaurant_id", restaurantId);

    if(error){
      showMsg($("adminMsg"), "Änderung fehlgeschlagen: " + error.message);
      return;
    }

    await loadItems();
  }

  function openEdit(id){
    const item = currentItems.find(x=>x.id===id);
    if(!item) return;

    $("editId").value = item.id;
    $("editName").value = item.name || "";
    $("editPrice").value = item.price ?? "";
    $("editDescription").value = item.description || "";
    $("editCategory").value = item.category || "";
    $("editServing").value = item.serving_size || "";
    $("editCalories").value = item.calories ?? "";
    $("editProtein").value = item.protein ?? "";
    $("editFat").value = item.fat ?? "";
    $("editCarbs").value = item.carbs ?? "";
    $("editIngredients").value = Array.isArray(item.ingredients) ? item.ingredients.join(", ") : "";
    $("editAllergens").value = Array.isArray(item.allergens) ? item.allergens.join(", ") : "";
    $("editVegetarian").checked = !!item.vegetarian;
    $("editVegan").checked = !!item.vegan;
    $("editGlutenFree").checked = !!item.gluten_free;
    $("editBestseller").checked = !!item.bestseller;
    $("editAvailable").checked = !!item.available;
    showMsg($("editMsg"), "");
    $("editModal").classList.remove("hidden");
  }

  function csvToArray(v){
    return v.split(",").map(x=>x.trim()).filter(Boolean);
  }

  async function saveEdit(){
    const id = Number($("editId").value);

    const payload = {
      name: $("editName").value.trim(),
      price: Number($("editPrice").value),
      description: $("editDescription").value.trim(),
      category: $("editCategory").value.trim(),
      serving_size: $("editServing").value.trim() || null,
      calories: $("editCalories").value === "" ? null : Number($("editCalories").value),
      protein: $("editProtein").value === "" ? null : Number($("editProtein").value),
      fat: $("editFat").value === "" ? null : Number($("editFat").value),
      carbs: $("editCarbs").value === "" ? null : Number($("editCarbs").value),
      ingredients: csvToArray($("editIngredients").value),
      allergens: csvToArray($("editAllergens").value),
      vegetarian: $("editVegetarian").checked,
      vegan: $("editVegan").checked,
      gluten_free: $("editGlutenFree").checked,
      bestseller: $("editBestseller").checked,
      available: $("editAvailable").checked
    };

    if(!payload.name || Number.isNaN(payload.price)){
      showMsg($("editMsg"), "Name und Preis sind erforderlich.");
      return;
    }

    $("saveEdit").disabled = true;
    const { error } = await supabase
      .from("menu_items")
      .update(payload)
      .eq("id", id)
      .eq("restaurant_id", restaurantId);
    $("saveEdit").disabled = false;

    if(error){
      showMsg($("editMsg"), "Speichern fehlgeschlagen: " + error.message);
      return;
    }

    $("editModal").classList.add("hidden");
    await loadItems();
  }

  async function logout(){
    await supabase.auth.signOut();
    location.reload();
  }

  $("loginBtn").addEventListener("click", login);
  $("password").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
  $("logoutBtn").addEventListener("click", logout);
  $("refreshBtn").addEventListener("click", loadItems);
  $("cancelEdit").addEventListener("click", ()=>$("editModal").classList.add("hidden"));
  $("saveEdit").addEventListener("click", saveEdit);

  init();
</script>
</body>
</html>
